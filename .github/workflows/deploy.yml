# R49 — build images, deploy to a Kubernetes environment with Helm, smoke-test the result.
#
# Runs on a version tag (v*) for production, or by hand for any environment. Production is a GitHub
# Environment with a required reviewer, so a deploy waits for approval.
#
# R73: production deploys run on a SELF-HOSTED runner (labels self-hosted, wecrew-prod) on the machine
# that reaches the cluster — see docs/DEPLOY.md, "Self-hosted runner". That job needs NO cluster secrets
# in GitHub: it reuses the live release's values. Set the Environment variable KIND_CLUSTER when the
# cluster is kind (images are docker-pulled and kind-loaded). Staging keeps the KUBECONFIG_B64 path.
#
# One-time setup per GitHub Environment (Settings → Environments → <name>):
#   variables  DOMAIN, INGEST_DOMAIN           e.g. jobwatch-staging.example.com, ingest.jobwatch-staging.example.com
#              KEYCLOAK_ISSUER                 https://sso.example.com/realms/cronsentinel
#              NAMESPACE (default jobwatch)    RELEASE (default jobwatch)
#   secrets    KUBECONFIG_B64                  base64 kubeconfig for a deploy service account (namespace-scoped)
#              DATABASE_URL, MIGRATION_DATABASE_URL, APP_DB_PASSWORD
#              SECRET_ENCRYPTION_KEY           openssl rand -base64 48 — never change it after first deploy
#              KEYCLOAK_CLIENT_SECRET, KEYCLOAK_ADMIN_CLIENT_SECRET (from deploy/keycloak/import.sh)
#              REDIS_URL (optional), STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET (optional)
#              SMOKE_PING_TOKEN (optional)     ping token of a job kept for smoke tests
# See docs/DEPLOY.md.
name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment to deploy to"
        required: true
        default: production
        type: choice
        options: [production, staging]

permissions:
  contents: write     # attach agent binaries to the GitHub release on tags
  packages: write     # push images to GHCR

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false   # never interrupt a Helm upgrade half way

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  images:
    runs-on: ubuntu-24.04
    environment: ${{ github.event.inputs.environment || 'production' }}
    strategy:
      matrix:
        include:
          - {name: api, context: ., file: infra/docker/Dockerfile.api}
          - {name: web, context: ., file: infra/docker/Dockerfile.web}
          - {name: k8s-agent, context: agents/k8s-agent, file: agents/k8s-agent/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/jobwatch-${{ matrix.name }}:${{ env.TAG }}
          # The web bundle bakes in its public URLs, so it is built per environment.
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.DOMAIN }}
            NEXT_PUBLIC_INGEST_URL=https://${{ vars.INGEST_DOMAIN }}
            NEXT_PUBLIC_BOOKING_URL=${{ vars.BOOKING_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  agent-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - run: cd agents/linux-agent && make release VERSION=${{ github.ref_name }}
      - name: Attach Linux agent binaries and SHA256SUMS to the release
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" agents/linux-agent/dist/* --clobber

  deploy:
    needs: images
    # R73: production runs on a self-hosted runner on the machine that reaches the cluster
    # (labels: self-hosted, wecrew-prod); staging still uses a GitHub runner with a kubeconfig secret.
    runs-on: ${{ (github.event.inputs.environment || 'production') == 'production' && fromJSON('["self-hosted","wecrew-prod"]') || 'ubuntu-24.04' }}
    environment: ${{ github.event.inputs.environment || 'production' }}
    env:
      NAMESPACE: ${{ vars.NAMESPACE || 'jobwatch' }}
      RELEASE: ${{ vars.RELEASE || 'jobwatch' }}
      ENV_NAME: ${{ github.event.inputs.environment || 'production' }}
      # R73: a self-hosted runner has no cluster secrets in GitHub; the live release already holds them
      REUSE_VALUES: ${{ secrets.DATABASE_URL == '' && 'true' || 'false' }}
      KIND_CLUSTER: ${{ vars.KIND_CLUSTER }}   # set when the cluster is kind: images are docker-pulled and kind-loaded
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        if: runner.environment != 'self-hosted'
        with: {version: v3.16.2}
      - name: Kubeconfig
        if: runner.environment != 'self-hosted'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --client=true
      - name: Tools on the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          for t in docker kubectl helm; do command -v $t >/dev/null || { echo "::error::$t is not installed on this runner"; exit 1; }; done
          [ -z "$KIND_CLUSTER" ] || command -v kind >/dev/null || { echo "::error::kind is not installed on this runner"; exit 1; }
          kubectl cluster-info >/dev/null || { echo "::error::the cluster is not reachable from this runner (is Docker Desktop / kind running?)"; exit 1; }
          helm status "$RELEASE" -n "$NAMESPACE" >/dev/null || { echo "::error::release $RELEASE not found in $NAMESPACE — the first install needs secrets, see docs/DEPLOY.md"; exit 1; }

      - name: Pull images and load them into kind
        if: env.KIND_CLUSTER != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${REGISTRY}/jobwatch-api:${TAG}"
          docker pull "${REGISTRY}/jobwatch-web:${TAG}"
          kind load docker-image "${REGISTRY}/jobwatch-api:${TAG}" "${REGISTRY}/jobwatch-web:${TAG}" --name "$KIND_CLUSTER"
          docker logout ghcr.io

      - name: Database backup (kept 30 days as a workflow artifact)
        id: backup
        run: |
          set -euo pipefail
          URL=$(helm get values "$RELEASE" -n "$NAMESPACE" -o json | python3 -c 'import sys,json; v=json.load(sys.stdin); print(v.get("migration",{}).get("databaseUrl") or v.get("env",{}).get("DATABASE_URL") or "")')
          [ -n "$URL" ] || { echo "::warning::no database URL in the release values; skipping backup"; exit 0; }
          # psycopg URLs carry a "+psycopg" scheme suffix that pg_dump does not understand
          URL=${URL/postgresql+psycopg:/postgresql:}
          kubectl -n "$NAMESPACE" run "pgdump-${{ github.run_id }}" --rm -i --restart=Never --quiet \
            --image=postgres:16-alpine --env="PGURL=$URL" -- sh -c 'pg_dump --no-owner "$PGURL"' > "db-before-${TAG}.sql"
          ls -la "db-before-${TAG}.sql"; echo "file=db-before-${TAG}.sql" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.backup.outputs.file != ''
        with: {name: "db-before-${{ env.TAG }}", path: "${{ steps.backup.outputs.file }}", retention-days: 30, if-no-files-found: ignore}
      - name: Remove the local backup copy
        if: always()
        run: rm -f db-before-*.sql

      - name: Helm upgrade — reuse the live release's values (self-hosted, no GitHub secrets)
        if: env.REUSE_VALUES == 'true'
        run: |
          set -euo pipefail
          helm upgrade "$RELEASE" infra/helm/cronsentinel --namespace "$NAMESPACE" \
            --reuse-values \
            -f "deploy/environments/${ENV_NAME}.yaml" \
            --set-string "image.api=${REGISTRY}/jobwatch-api:${TAG}" \
            --set-string "image.web=${REGISTRY}/jobwatch-web:${TAG}" \
            ${KIND_CLUSTER:+--set-string imagePullPolicy=IfNotPresent} \
            --set-string "env.AGENT_DOWNLOAD_BASE=https://github.com/${{ github.repository }}/releases/download" \
            --set-string "env.AGENT_VERSION=${TAG}" \
            --atomic --wait --timeout 15m

      - name: Helm upgrade — from GitHub Environment secrets (migrations run first, as a pre-upgrade hook)
        if: env.REUSE_VALUES != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for v in DATABASE_URL MIGRATION_DATABASE_URL APP_DB_PASSWORD SECRET_ENCRYPTION_KEY; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set for this environment"; exit 1; }
          done
          # Secrets go through a values file on the runner's disk, never the command line (which
          # shows up in process listings and debug logs).
          python3 - <<'PY' > /tmp/secret-values.yaml
          import json, os
          env = {k: os.environ[k] for k in ("DATABASE_URL", "SECRET_ENCRYPTION_KEY", "KEYCLOAK_CLIENT_SECRET",
                 "KEYCLOAK_ADMIN_CLIENT_SECRET", "STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET") if os.environ.get(k)}
          if os.environ.get("REDIS_URL"): env["REDIS_URL"] = os.environ["REDIS_URL"]
          print(json.dumps({"env": env, "migration": {"databaseUrl": os.environ["MIGRATION_DATABASE_URL"],
                                                      "appDbPassword": os.environ["APP_DB_PASSWORD"]}}))
          PY
          helm upgrade --install "$RELEASE" infra/helm/cronsentinel \
            --namespace "$NAMESPACE" --create-namespace \
            -f "deploy/environments/${ENV_NAME}.yaml" \
            -f /tmp/secret-values.yaml \
            --set-string "image.api=${REGISTRY}/jobwatch-api:${TAG}" \
            --set-string "image.web=${REGISTRY}/jobwatch-web:${TAG}" \
            --set-string "domain=${{ vars.DOMAIN }}" --set-string "ingestDomain=${{ vars.INGEST_DOMAIN }}" \
            --set-string "env.API_PUBLIC_URL=https://${{ vars.DOMAIN }}" \
            --set-string "env.WEB_PUBLIC_URL=https://${{ vars.DOMAIN }}" \
            --set-string "env.INGEST_PUBLIC_URL=https://${{ vars.INGEST_DOMAIN }}" \
            --set-string "env.AGENT_DOWNLOAD_BASE=https://github.com/${{ github.repository }}/releases/download" \
            --set-string "env.AGENT_VERSION=${TAG}" \
            --set-string "env.KEYCLOAK_ISSUER=${{ vars.KEYCLOAK_ISSUER }}" \
            --atomic --wait --timeout 15m
          rm -f /tmp/secret-values.yaml

      - name: Smoke test
        env:
          SMOKE_PING_TOKEN: ${{ secrets.SMOKE_PING_TOKEN }}
        run: |
          set -euo pipefail
          # the domains come from the GitHub Environment when set, else from the live release
          DOMAIN="${{ vars.DOMAIN }}"; INGEST="${{ vars.INGEST_DOMAIN }}"
          if [ -z "$DOMAIN" ]; then
            read -r DOMAIN INGEST < <(helm get values "$RELEASE" -n "$NAMESPACE" -o json | python3 -c 'import sys,json; v=json.load(sys.stdin); print(v.get("domain",""), v.get("ingestDomain",""))')
          fi
          bash deploy/smoke.sh "https://$DOMAIN" "https://$INGEST"

      - name: Roll back if the smoke test failed
        if: failure()
        run: |
          helm history "$RELEASE" -n "$NAMESPACE" --max 5 || true
          if [ "$(helm history "$RELEASE" -n "$NAMESPACE" -o json | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))')" -gt 1 ]; then
            helm rollback "$RELEASE" -n "$NAMESPACE" --wait --timeout 10m
            echo "::warning::rolled back the application to the previous release. Database migrations are NOT rolled back: check docs/DEPLOY.md (Rollback) for migrations the previous release cannot run on."
          fi
